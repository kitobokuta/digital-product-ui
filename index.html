<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JUPITER UNIVERSE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --hint-color: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 12px;
            padding-bottom: 30px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .back-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            font-size: 13px;
        }

        .search-box {
            margin-bottom: 12px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--hint-color);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card.is-inactive {
            opacity: 0.5;
        }

        .card-number {
            position: absolute;
            top: 6px;
            left: 8px;
            font-size: 10px;
            color: var(--hint-color);
        }

        .card-img-wrap {
            width: 54px;
            height: 54px;
            margin-top: 6px;
            margin-bottom: 8px;
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .card h3 {
            font-size: 13px;
            text-align: center;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .card .duration {
            font-size: 11px;
            color: var(--hint-color);
            margin-bottom: 4px;
        }

        .card .price {
            font-size: 12px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .card-footer-ornament {
            font-size: 10px;
            margin-top: 4px;
        }

        .unavailable-badge {
            font-size: 9px;
            color: var(--danger-color);
            font-weight: bold;
            margin-top: 4px;
        }

        .detail-view {
            display: none;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .detail-header img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
        }

        .detail-info h2 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .detail-info p {
            font-size: 12px;
            color: var(--hint-color);
        }

        .detail-info .price-tag {
            font-size: 14px;
            color: var(--accent-color);
            font-weight: bold;
            margin-top: 2px;
        }

        .note-box {
            background: rgba(59, 130, 246, 0.1);
            border-left: 3px solid var(--accent-color);
            padding: 8px 12px;
            font-size: 12px;
            border-radius: 4px;
            margin-bottom: 14px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group input {
            padding: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 13px;
            outline: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--hint-color);
            font-size: 13px;
        }

        .unavail-msg {
            text-align: center;
            color: var(--danger-color);
            font-size: 13px;
            padding: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="back-btn" id="backBtn" onclick="goBack()">← နောက်သို့</button>
    </div>

    <div class="search-box" id="searchContainer">
        <input type="text" id="searchInput" placeholder="ပစ္စည်းအမည် ရှာဖွေရန်..." oninput="handleSearch()">
    </div>

    <div class="tabs" id="tabContainer">
        <button class="tab-btn active" id="tabPremium" onclick="switchTab('PREMIUM')">Premium Item</button>
        <button class="tab-btn" id="tabService" onclick="switchTab('SERVICE')">Log in Service</button>
        <button class="tab-btn" id="tabBundle" onclick="switchTab('BUNDLE')">Bundle Item</button>
    </div>

    <div id="loading" class="loading">အချက်အလက်များ ရယူနေပါသည်...</div>

    <div id="productGrid" class="grid"></div>
    <div id="categoryGrid" class="grid" style="display:none;"></div>

    <div id="detailView" class="detail-view">
        <div class="detail-header">
            <img id="detailLogo" src="" alt="">
            <div class="detail-info">
                <h2 id="productTitle"></h2>
                <p id="productDuration"></p>
                <div class="price-tag" id="productPrice"></div>
            </div>
        </div>

        <div id="noteBox" class="note-box" style="display:none;"></div>
        <div id="unavailMsg" class="unavail-msg">လတ်တလော ဝယ်ယူ၍ မရနိုင်သေးပါ။</div>

        <div id="inputForm" class="input-group">
            <input type="email" id="accountEmail" placeholder="Email / Username (လိုအပ်ပါက)">
            <input type="text" id="accountPsw" placeholder="Password (လိုအပ်ပါက)">
            <input type="text" id="accountPhone" placeholder="Phone Number (လိုအပ်ပါက)">
            <input type="text" id="accountRemarks" placeholder="ဖြည့်စွက်ချက် / မှတ်ချက်">
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        try { 
            tg.ready();
            tg.expand(); 
        } catch(e){}

        const API_URL = "https://script.google.com/macros/s/AKfycbz_DalKW3vfaMtxBNwHIVfVfRCoqvE2tJKu_EMj-I-uaXgeIKjyxJMf-hvdAohdNNg-/exec";

        let rawData = [];
        let selectedProduct = null;
        let currentView = 'PRODUCTS';
        let currentTab = 'PREMIUM';
        let lastSelectedProductName = '';

        function getProp(obj, keys) {
            if (!obj) return "";
            for (let k of keys) {
                for (let prop in obj) {
                    if (prop.toLowerCase() === k.toLowerCase()) {
                        let val = obj[prop];
                        if (val !== undefined && val !== null && String(val).trim() !== "") {
                            return String(val).trim();
                        }
                    }
                }
            }
            return "";
        }

        function switchTab(tabType) {
            currentTab = tabType;
            document.getElementById('tabPremium').classList.toggle('active', tabType === 'PREMIUM');
            document.getElementById('tabService').classList.toggle('active', tabType === 'SERVICE');
            document.getElementById('tabBundle').classList.toggle('active', tabType === 'BUNDLE');
            
            document.getElementById('searchInput').value = '';
            showProducts();
        }

        function getSvgInitialsLogo(text) {
            const initial = (text || "J").trim().charAt(0).toUpperCase();
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
                <rect width="100" height="100" rx="50" fill="url(#metalGrad)"/>
                <defs>
                    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#374151"/>
                        <stop offset="100%" stop-color="#111827"/>
                    </linearGradient>
                </defs>
                <text x="50%" y="54%" font-family="-apple-system, Roboto, sans-serif" font-weight="bold" font-size="44" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">${initial}</text>
            </svg>`;
            return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
        }

        function resolveLogo(item, categoryName) {
            if (!item) return getSvgInitialsLogo(categoryName);
            let logoVal = getProp(item, ["logo", "image", "img"]);
            if (logoVal !== "") {
                if (logoVal.startsWith("http://") || logoVal.startsWith("https://") || logoVal.startsWith("data:")) return logoVal;
                if (!logoVal.startsWith("images/")) logoVal = "images/" + logoVal;
                return logoVal;
            }
            return getSvgInitialsLogo(getProp(item, ["name", "title"]) || categoryName);
        }

        async function fetchProducts() {
            try {
                const timestampUrl = API_URL + (API_URL.includes("?") ? "&" : "?") + "_t=" + new Date().getTime();
                const response = await fetch(timestampUrl, { redirect: "follow" });
                rawData = await response.json();
                document.getElementById('loading').style.display = 'none';
                showProducts();
            } catch (error) {
                console.error("Fetch error:", error);
                document.getElementById('loading').innerHTML = `<div style="color: var(--hint-color); font-size: 12px; text-align: center;">Data ရယူ၍ မရနိုင်ပါ။</div>`;
            }
        }

        function showProducts(searchQuery = "") {
            currentView = 'PRODUCTS';
            document.getElementById('searchContainer').style.display = 'block';
            document.getElementById('tabContainer').style.display = 'flex';
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('productGrid').style.display = 'grid';
            document.getElementById('categoryGrid').style.display = 'none';
            document.getElementById('detailView').style.display = 'none';
            try { tg.MainButton.hide(); } catch(e){}

            const container = document.getElementById('productGrid');
            container.innerHTML = '';

            const uniqueProductsMap = new Map();
            const query = searchQuery.trim().toLowerCase();

            rawData.forEach((prod) => {
                const sheetType = getProp(prod, ["sheet_type", "type"]);
                const prodName = getProp(prod, ["name", "title"]);
                if (!prodName) return;

                const nameLower = prodName.toLowerCase();

                if (query === "") {
                    let isMatchedTab = false;
                    if (currentTab === 'PREMIUM' && (sheetType === "Products Master Database" || sheetType === "Premium")) isMatchedTab = true;
                    if (currentTab === 'SERVICE' && sheetType === "Log in Service") isMatchedTab = true;
                    if (currentTab === 'BUNDLE' && (sheetType === "Bundle Item" || sheetType === "Game Items")) isMatchedTab = true;

                    if (isMatchedTab) {
                        if (!uniqueProductsMap.has(prodName)) {
                            uniqueProductsMap.set(prodName, prod);
                        }
                    }
                } else {
                    if (nameLower.includes(query)) {
                        if (!uniqueProductsMap.has(prodName)) {
                            uniqueProductsMap.set(prodName, prod);
                        }
                    }
                }
            });

            if (uniqueProductsMap.size === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--hint-color); padding: 30px; font-size: 12px;">ပစ္စည်းများ မရှိပါ။</div>`;
                return;
            }

            let index = 1;
            uniqueProductsMap.forEach((prod, prodName) => {
                const logoSrc = resolveLogo(prod, prodName);
                const fallbackSrc = getSvgInitialsLogo(prodName);

                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${(index - 1) * 0.04}s`;
                card.innerHTML = `
                    <div class="card-number">${index < 10 ? '0' + index : index}</div>
                    <div class="card-img-wrap">
                        <img src="${logoSrc}" alt="${prodName}" onerror="this.onerror=null; this.src='${fallbackSrc}';">
                    </div>
                    <h3>${prodName}</h3>
                    <div class="card-footer-ornament">👑</div>
                `;
                
                card.onclick = () => showVariants(prodName);
                container.appendChild(card);
                index++;
            });
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value;
            if (currentView === 'PRODUCTS') {
                showProducts(query);
            } else if (currentView === 'VARIANTS') {
                showVariants(lastSelectedProductName, query);
            }
        }

        function showVariants(prodName, searchQuery = "") {
            currentView = 'VARIANTS';
            lastSelectedProductName = prodName;
            const query = searchQuery.trim().toLowerCase();
            
            const matchedItems = rawData.filter(i => {
                const nameMatch = getProp(i, ["name", "title"]) === prodName;
                if (!nameMatch) return false;
                if (query === "") return true;
                const itemCat = (getProp(i, ["category", "cat"]) || prodName).toLowerCase();
                return itemCat.includes(query);
            });

            document.getElementById('searchContainer').style.display = 'block';
            document.getElementById('tabContainer').style.display = 'none';
            document.getElementById('backBtn').style.display = 'inline-block';
            document.getElementById('productGrid').style.display = 'none';
            document.getElementById('categoryGrid').style.display = 'grid';
            document.getElementById('detailView').style.display = 'none';
            try { tg.MainButton.hide(); } catch(e){}

            const container = document.getElementById('categoryGrid');
            container.innerHTML = '';

            if (matchedItems.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--hint-color); padding: 30px; font-size: 12px;">ဤအမျိုးအစားထဲတွင် ရှာဖွေမှုနှင့် ကိုက်ညီသော ပစ္စည်းများ မရှိပါ။</div>`;
                return;
            }

            matchedItems.forEach((item, index) => {
                const itemCat = getProp(item, ["category", "cat"]) || prodName;
                const itemPrice = getProp(item, ["price", "cost"]) || '0';
                const itemDuration = getProp(item, ["duration", "time"]) || '';
                const itemStatus = (getProp(item, ["status", "stat"]) || 'Active').toLowerCase();
                const isInactive = itemStatus === 'inactive';

                const logoSrc = resolveLogo(item, itemCat);
                const fallbackSrc = getSvgInitialsLogo(itemCat);

                const card = document.createElement('div');
                card.className = `card ${isInactive ? 'is-inactive' : ''}`;
                card.style.animationDelay = `${index * 0.04}s`;
                card.innerHTML = `
                    <div class="card-number">${(index + 1) < 10 ? '0' + (index + 1) : (index + 1)}</div>
                    <div class="card-img-wrap">
                        <img src="${logoSrc}" alt="${itemCat}" onerror="this.onerror=null; this.src='${fallbackSrc}';">
                    </div>
                    <h3>${itemCat}</h3>
                    ${itemDuration ? `<div class="duration">⏱ ${itemDuration}</div>` : ''}
                    <div class="price">${itemPrice} MMK</div>
                    ${isInactive ? `<div class="unavailable-badge">UNAVAILABLE</div>` : `<div class="card-footer-ornament">👑</div>`}
                `;
                card.onclick = () => showDetail(item);
                container.appendChild(card);
            });
        }

        function showDetail(product) {
            currentView = 'DETAIL';
            selectedProduct = product;
            document.getElementById('searchContainer').style.display = 'none';
            document.getElementById('tabContainer').style.display = 'none';
            document.getElementById('backBtn').style.display = 'inline-block';
            document.getElementById('productGrid').style.display = 'none';
            document.getElementById('categoryGrid').style.display = 'none';
            document.getElementById('detailView').style.display = 'block';

            document.getElementById('accountEmail').value = '';
            document.getElementById('accountPsw').value = '';
            document.getElementById('accountPhone').value = '';
            document.getElementById('accountRemarks').value = '';

            const prodName = getProp(product, ["name", "title"]);
            const prodCat = getProp(product, ["category", "cat"]);
            const prodPrice = getProp(product, ["price", "cost"]);
            const prodDuration = getProp(product, ["duration", "time"]);
            const prodDesc = getProp(product, ["description", "desc"]);
            
            const prodStatus = (getProp(product, ["status", "stat"]) || 'Active').toLowerCase();
            const isInactive = prodStatus === 'inactive';

            document.getElementById('detailLogo').src = resolveLogo(product, prodName);
            document.getElementById('productTitle').innerText = prodCat && prodCat !== prodName ? `${prodName} - ${prodCat}` : prodName;
            document.getElementById('productDuration').innerText = prodDuration ? `⏱ ${prodDuration}` : '';
            document.getElementById('productPrice').innerText = `${prodPrice} MMK`;

            const noteBox = document.getElementById('noteBox');
            if (prodDesc) {
                noteBox.innerHTML = `📌 <b>Condition / Note:</b><br>${prodDesc}`;
                noteBox.style.display = 'block';
            } else {
                noteBox.style.display = 'none';
            }

            const unavailMsg = document.getElementById('unavailMsg');
            const inputForm = document.getElementById('inputForm');

            if (isInactive) {
                unavailMsg.style.display = 'block';
                inputForm.style.display = 'none';
                try { tg.MainButton.hide(); } catch(e){}
            } else {
                unavailMsg.style.display = 'none';
                inputForm.style.display = 'flex';
                try {
                    tg.MainButton.setText(`ORDER NOW (${prodPrice} MMK)`);
                    tg.MainButton.show();
                    tg.MainButton.offClick(sendOrder);
                    tg.MainButton.onClick(sendOrder);
                } catch(e){}
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBack() {
            if (currentView === 'DETAIL') {
                document.getElementById('searchInput').value = '';
                showVariants(lastSelectedProductName);
            } else if (currentView === 'VARIANTS') {
                document.getElementById('searchInput').value = '';
                showProducts();
            }
        }

        async function sendOrder() {
            if (!selectedProduct) return;
            
            const accEmail = document.getElementById('accountEmail').value.trim();
            const accPsw = document.getElementById('accountPsw').value.trim();
            const accPhone = document.getElementById('accountPhone').value.trim();
            const accRemarks = document.getElementById('accountRemarks').value.trim();

            let detailsArr = [];
            if (accEmail) detailsArr.push(`Email: ${accEmail}`);
            if (accPsw) detailsArr.push(`Password: ${accPsw}`);
            if (accPhone) detailsArr.push(`Phone: ${accPhone}`);
            if (accRemarks) detailsArr.push(`Remarks: ${accRemarks}`);

            const accountSummaryText = detailsArr.length > 0 ? detailsArr.join(', ') : '-';

            const prodName = getProp(selectedProduct, ["name", "title"]);
            const prodCat = getProp(selectedProduct, ["category", "cat"]);
            const prodPrice = getProp(selectedProduct, ["price", "cost"]);
            const prodDuration = getProp(selectedProduct, ["duration", "time"]);

            const fullItemName = `${prodName} (${prodCat}${prodDuration ? ' - ' + prodDuration : ''})`;
            const orderId = `ORD-${Math.floor(100000000 + Math.random() * 900000000)}`;

            const payload = {
                orderId: orderId,
                item: fullItemName,
                price: prodPrice,
                details: accountSummaryText,
                initData: tg.initData
            };

            // Telegram WebApp သို့ Payload ပို့ပေးခြင်း
            tg.sendData(JSON.stringify(payload));
        }

        fetchProducts();
    </script>
</body>
</html>
