<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jupiter Store Digital Products</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #181a20;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border-color: #2a2d35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Padauk', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 90px;
        }

        /* Header UI */
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.4rem;
            color: #fff;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .header p {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* Product Cards Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #232730;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            line-height: 1.3;
        }

        .card-cat {
            font-size: 0.75rem;
            color: var(--accent-color);
            margin-top: 2px;
        }

        .card-price {
            font-size: 0.95rem;
            font-weight: 700;
            color: #10b981;
            margin-top: 8px;
        }

        /* Modal / Pop-up Form */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: flex-end;
            z-index: 999;
            backdrop-filter: blur(4px);
        }

        .modal {
            background: var(--card-bg);
            width: 100%;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            animation: slideUp 0.2s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }

        /* Loading Spinner */
        .loader {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>JUPITER STORE</h1>
        <p>PREMIUM DIGITAL PRODUCTS</p>
    </div>

    <!-- Product Grid CONTAINER -->
    <div id="productGrid" class="grid">
        <div class="loader"><i class="fa-solid fa-spinner fa-spin"></i> ပစ္စည်းများ ဆွဲယူနေပါသည်...</div>
    </div>

    <!-- ORDER FORM MODAL -->
    <div id="orderModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Order Details</h3>
                <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="form-group">
                <label for="accountData">အကောင့်အချက်အလက် (Phone / Email / ID)</label>
                <input type="text" id="accountData" placeholder="ဝယ်ယူမည့် အကောင့်အချက်အလက် ထည့်ပါ...">
            </div>

            <button id="orderBtn" class="btn-submit" onclick="sendOrderDirect()">ORDER NOW</button>
        </div>
    </div>

    <script>
        // 🔗 ထည့်သွင်းပေးလိုက်သော Google Apps Script API URL
        const CATALOG_API_URL = "https://script.google.com/macros/s/AKfycbwnxWap5IdSBRtmvPI8UKQR-p2U72UJRDcm3YpE-XCXQmNzDhNKnVAUqnjPdoL6FLs/exec";
        
        let products = [];
        let selectedProduct = null;

        // Telegram WebApp SDK Initialize
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // 1. Fetch Products from Google Apps Script
        async function loadProducts() {
            try {
                const res = await fetch(CATALOG_API_URL);
                products = await res.json();
                renderProducts(products);
            } catch (err) {
                document.getElementById('productGrid').innerHTML = `<div class="loader" style="color: #ef4444;">ပစ္စည်းများ ရယူ၍ မရနိုင်ပါ။ ထပ်မံ ကြိုးစားပေးပါ။</div>`;
            }
        }

        // Helper function for Data Mapping
        function getProp(obj, keys) {
            for (let k of keys) {
                if (obj && obj[k] !== undefined && obj[k] !== null) return obj[k];
            }
            return '';
        }

        // 2. Render Products into Grid UI
        function renderProducts(items) {
            const container = document.getElementById('productGrid');
            if (!items || items.length === 0) {
                container.innerHTML = `<div class="loader">လက်ရှိ ရောင်းချပေးနိုင်သော ပစ္စည်းမရှိသေးပါ။</div>`;
                return;
            }

            container.innerHTML = items.map((item, index) => {
                const name = getProp(item, ["name", "title"]);
                const cat = getProp(item, ["category", "cat"]);
                const price = getProp(item, ["price", "cost"]);
                const logo = getProp(item, ["logo", "img"]) || "https://via.placeholder.com/150";

                return `
                    <div class="card" onclick="openOrderModal(${index})">
                        <img src="${logo}" class="card-img" alt="${name}" onerror="this.src='https://via.placeholder.com/150'">
                        <div class="card-title">${name}</div>
                        <div class="card-cat">${cat}</div>
                        <div class="card-price">${price} MMK</div>
                    </div>
                `;
            }).join('');
        }

        // 3. Open Modal Form
        function openOrderModal(index) {
            selectedProduct = products[index];
            const name = getProp(selectedProduct, ["name", "title"]);
            const price = getProp(selectedProduct, ["price", "cost"]);

            document.getElementById('modalTitle').innerText = name;
            document.getElementById('orderBtn').innerText = `ORDER NOW (${price} MMK)`;
            document.getElementById('accountData').value = '';
            document.getElementById('orderModal').style.display = 'flex';
        }

        // Close Modal Form
        function closeModal() {
            document.getElementById('orderModal').style.display = 'none';
            selectedProduct = null;
        }

        // 4. Send Order via Telegram WebApp Native sendData()
        function sendOrderDirect() {
            if (!selectedProduct) return;

            const userInput = document.getElementById('accountData').value;
            const prodName = getProp(selectedProduct, ["name", "title"]);
            const prodCat = getProp(selectedProduct, ["category", "cat"]);
            const prodPrice = getProp(selectedProduct, ["price", "cost"]);
            const prodCost = getProp(selectedProduct, ["cost_price", "costPrice"]) || 0;
            const prodDuration = getProp(selectedProduct, ["duration", "time"]) || "-";

            const fullItemName = `${prodName} (${prodCat}${prodDuration !== '-' ? ' - ' + prodDuration : ''})`;
            const orderId = `ORD-${Math.floor(100000000 + Math.random() * 900000000)}`;

            // Python Bot ရဲ့ handle_webapp_data မျှော်လင့်ထားသည့် Payload ပုံစံ
            const orderPayload = {
                order_id: orderId,
                full_item_name: fullItemName,
                price: prodPrice,
                cost_price: prodCost,
                customer_note: userInput || '-',
                duration: prodDuration
            };

            if (tg) {
                // Telegram Bot သို့ Data Native နည်းလမ်းဖြင့် တိုက်ရိုက် ပို့ပေးခြင်း
                tg.sendData(JSON.stringify(orderPayload));
                tg.close(); // Mini App Window ကို ချက်ချင်း ပိတ်မည်
            } else {
                alert("ကျေးဇူးပြု၍ Telegram App အတွင်းမှသာ အသုံးပြုပေးပါခင်ဗျာ။");
            }
        }

        // Load Products on Startup
        window.onload = loadProducts;
    </script>
</body>
</html>
